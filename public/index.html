  <div class="join-container">
    <form id="nicknameForm" class="join-form">
      <h1>💬WeeChat</h1>
  
      <input
        type="text"
        name="nickname"
        id="nicknameInput"
        placeholder="Enter your username"
        required
      />
  
      <div id="chat_chat">
        <h4>Select a chat room</h4>
      </div>
      <select name="chatrooms" id="chatrooms">
        <option value="room1">🌐 Chat Room 01</option>
        <option value="room2">💬 Chat Room 02</option>
        <option value="room3">🎮 Chat Room 03</option>
      </select>
  
      <button type="submit">Let's Go 🚀</button>
    </form>
  </div>
  
  <script>
    const nicknameForm = document.getElementById("nicknameForm");
    const nicknameInput = document.getElementById("nicknameInput");
    const chatroom = document.getElementById("chatrooms");

    nicknameForm.addEventListener("submit", (e) => {
      e.preventDefault();
      if (nicknameInput.value) {
        localStorage.setItem("nickname", nicknameInput.value);
        localStorage.setItem("chatroom", chatroom.value);
        window.location.replace("/chat.html");
      }
    });
  </script>
